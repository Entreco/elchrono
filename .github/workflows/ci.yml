name: Kotlin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/kotlin-cache/.m2.cache
            ${{ runner.temp }}/kotlin-cache/download.cache
            ${{ runner.temp }}/kotlin-cache/cli
            !${{ runner.temp }}/kotlin-cache/**/*.tmp
            !${{ runner.temp }}/kotlin-cache/**/*.part
            !${{ runner.temp }}/kotlin-cache/**/*.lock
            !${{ runner.temp }}/kotlin-cache/cli/download-*.bin
          key: kotlin-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'kotlin.bat', 'project.yaml', '**/module.yaml', '**/module-test.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-downloads-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Discover modules
        run: ./kotlin show modules
        env:
          KOTLIN_SHARED_CACHE_DIR: ${{ runner.temp }}/kotlin-cache
          KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ runner.temp }}/kotlin-cache/cli

      - name: Build JVM targets
        run: ./kotlin build -p jvm
        env:
          KOTLIN_SHARED_CACHE_DIR: ${{ runner.temp }}/kotlin-cache
          KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ runner.temp }}/kotlin-cache/cli

      - name: Build browser Wasm target
        run: ./kotlin build -m browser
        env:
          KOTLIN_SHARED_CACHE_DIR: ${{ runner.temp }}/kotlin-cache
          KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ runner.temp }}/kotlin-cache/cli

      - name: Run JVM tests
        run: ./kotlin test -p jvm -m common -m counter -m design -m settings -m localization
        env:
          KOTLIN_SHARED_CACHE_DIR: ${{ runner.temp }}/kotlin-cache
          KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ runner.temp }}/kotlin-cache/cli

      - name: Run checks
        run: ./kotlin check -m common -m counter -m design -m settings -m localization
        env:
          KOTLIN_SHARED_CACHE_DIR: ${{ runner.temp }}/kotlin-cache
          KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ runner.temp }}/kotlin-cache/cli
