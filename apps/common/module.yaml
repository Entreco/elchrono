product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core/counter
  - //core/design
  - //core/localization
  - //core/persistence
  - //features/about
  - //features/settings
  - //features/timer
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.compose.navigation3.ui
  - $libs.compose.cloudy
  - $libs.kotlinx.coroutines.core
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

dependencies@android:
  - $compose.uiTooling

test-dependencies@jvm:
  - $libs.compose.ui.test
  - $compose.desktop.currentOs: runtime-only
  - $libs.kotlinx.coroutines.swing: runtime-only

settings:
  compose: enabled
