<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Main screen state concepts</title>
  <desc id="description">Three side-by-side timer screen concepts for running, paused, and interrupted states. Each uses the same illustrative progress amount and a textual state label. There is no in-app volume control or interruption recovery in v1.</desc>
  <rect width="1200" height="560" fill="#f3f5f7"/>
  <text x="40" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#17212b">Main screen states</text>
  <text x="40" y="82" font-family="sans-serif" font-size="16" fill="#344454">Same illustrative remaining progress; state is named in text.</text>

  <g font-family="sans-serif">
    <rect x="40" y="112" width="350" height="390" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="66" y="154" font-size="24" font-weight="700" fill="#17212b">Running</text>
    <text x="66" y="202" font-size="18" font-weight="700" fill="#17212b">Remaining waiting time</text>
    <rect x="66" y="224" width="298" height="34" rx="8" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <path d="M74 226h173v30H74a6 6 0 0 1-6-6v-18a6 6 0 0 1 6-6z" fill="#344454"/>
    <text x="66" y="298" font-size="15" fill="#344454">Progress value shown is illustrative only.</text>
    <rect x="66" y="344" width="298" height="72" rx="12" fill="#f3f5f7" stroke="#71808f"/>
    <text x="86" y="374" font-size="17" font-weight="700" fill="#17212b">Settings</text>
    <text x="86" y="398" font-size="14" fill="#344454">Available without a caregiver gate in v1.</text>
    <text x="66" y="456" font-size="15" fill="#344454">Opening Settings pauses the countdown.</text>

    <rect x="425" y="112" width="350" height="390" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="451" y="154" font-size="24" font-weight="700" fill="#17212b">Paused</text>
    <text x="451" y="202" font-size="18" font-weight="700" fill="#17212b">Remaining waiting time</text>
    <rect x="451" y="224" width="298" height="34" rx="8" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <path d="M459 226h173v30H459a6 6 0 0 1-6-6v-18a6 6 0 0 1 6-6z" fill="#344454"/>
    <text x="451" y="298" font-size="15" fill="#344454">Progress value shown is illustrative only.</text>
    <rect x="451" y="344" width="298" height="72" rx="12" fill="#f3f5f7" stroke="#71808f"/>
    <text x="471" y="374" font-size="17" font-weight="700" fill="#17212b">Paused while Settings are open</text>
    <text x="471" y="398" font-size="14" fill="#344454">Saving starts a full-duration countdown.</text>
    <text x="451" y="456" font-size="15" fill="#344454">No separate pause control is in v1.</text>

    <rect x="810" y="112" width="350" height="390" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="836" y="154" font-size="24" font-weight="700" fill="#17212b">Interrupted</text>
    <text x="836" y="202" font-size="18" font-weight="700" fill="#17212b">Remaining waiting time</text>
    <rect x="836" y="224" width="298" height="34" rx="8" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <path d="M844 226h173v30H844a6 6 0 0 1-6-6v-18a6 6 0 0 1 6-6z" fill="#344454"/>
    <rect x="836" y="276" width="298" height="56" rx="8" fill="#ffffff" stroke="#344454" stroke-width="2"/>
    <text x="850" y="300" font-size="15" font-weight="700" fill="#17212b">Timer interrupted</text>
    <text x="850" y="320" font-size="14" fill="#344454">Progress may be out of date.</text>
    <rect x="836" y="358" width="298" height="72" rx="12" fill="#f3f5f7" stroke="#71808f"/>
    <text x="856" y="388" font-size="17" font-weight="700" fill="#17212b">Recovery is not provided in v1.</text>
    <text x="856" y="412" font-size="14" fill="#344454">Do not imply timing continuity.</text>
    <text x="836" y="466" font-size="15" fill="#344454">No volume control is included in v1.</text>
  </g>

  <text x="40" y="536" font-family="sans-serif" font-size="14" fill="#344454">Static design concept only. No clock face, time of day, completed state, audio, or recovery behavior is implemented.</text>
</svg>
