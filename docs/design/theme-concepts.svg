<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Timer theme concepts</title>
  <desc id="description">Three proposed progress visualizations: a quiet horizontal bar, a continuous bar with triangular structure, and a dot field. Each shows the same illustrative 60 percent remaining value.</desc>
  <defs>
    <clipPath id="dot-fill">
      <rect x="838" y="226" width="176" height="38" rx="2"/>
    </clipPath>
  </defs>
  <rect width="1200" height="430" fill="#f3f5f7"/>
  <text x="40" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#17212b">Theme concepts</text>
  <text x="40" y="82" font-family="sans-serif" font-size="16" fill="#344454">All use the same continuous remaining-time mapping; the 60% fill is illustrative.</text>

  <g font-family="sans-serif">
    <rect x="40" y="112" width="350" height="250" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="66" y="154" font-size="22" font-weight="700" fill="#17212b">Quiet bar</text>
    <text x="66" y="190" font-size="15" fill="#344454">Low-detail horizontal track</text>
    <rect x="66" y="224" width="298" height="42" rx="10" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <path d="M76 226h169v38H76a8 8 0 0 1-8-8v-22a8 8 0 0 1 8-8z" fill="#344454"/>
    <text x="66" y="310" font-size="15" fill="#17212b">60% remains (illustrative)</text>
    <text x="66" y="338" font-size="13" fill="#344454">Extent, not colour alone, carries progress.</text>

    <rect x="425" y="112" width="350" height="250" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="451" y="154" font-size="22" font-weight="700" fill="#17212b">Triangle path</text>
    <text x="451" y="190" font-size="15" fill="#344454">Triangles are pattern, not time units</text>
    <rect x="451" y="224" width="298" height="42" rx="10" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <path d="M461 226h169v38H461a8 8 0 0 1-8-8v-22a8 8 0 0 1 8-8z" fill="#344454"/>
    <path d="M475 226l22 38M519 226l22 38M563 226l22 38M607 226l22 38M651 226l22 38M695 226l22 38" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <text x="451" y="310" font-size="15" fill="#17212b">60% remains (illustrative)</text>
    <text x="451" y="338" font-size="13" fill="#344454">Continuous fill preserves the same mapping.</text>

    <rect x="810" y="112" width="350" height="250" rx="18" fill="#ffffff" stroke="#71808f" stroke-width="2"/>
    <text x="836" y="154" font-size="22" font-weight="700" fill="#17212b">Soft dot field</text>
    <text x="836" y="190" font-size="15" fill="#344454">A continuous mask over a quiet pattern</text>
    <rect x="836" y="224" width="298" height="42" rx="10" fill="#e1e6eb" stroke="#344454" stroke-width="2"/>
    <rect x="838" y="226" width="176" height="38" fill="#344454"/>
    <g fill="#71808f">
      <circle cx="858" cy="238" r="5"/><circle cx="883" cy="238" r="5"/><circle cx="908" cy="238" r="5"/><circle cx="933" cy="238" r="5"/><circle cx="958" cy="238" r="5"/><circle cx="983" cy="238" r="5"/><circle cx="1008" cy="238" r="5"/><circle cx="1033" cy="238" r="5"/><circle cx="1058" cy="238" r="5"/><circle cx="1083" cy="238" r="5"/><circle cx="1108" cy="238" r="5"/>
      <circle cx="858" cy="252" r="5"/><circle cx="883" cy="252" r="5"/><circle cx="908" cy="252" r="5"/><circle cx="933" cy="252" r="5"/><circle cx="958" cy="252" r="5"/><circle cx="983" cy="252" r="5"/><circle cx="1008" cy="252" r="5"/><circle cx="1033" cy="252" r="5"/><circle cx="1058" cy="252" r="5"/><circle cx="1083" cy="252" r="5"/><circle cx="1108" cy="252" r="5"/>
    </g>
    <g clip-path="url(#dot-fill)" fill="#ffffff">
      <circle cx="858" cy="238" r="5"/><circle cx="883" cy="238" r="5"/><circle cx="908" cy="238" r="5"/><circle cx="933" cy="238" r="5"/><circle cx="958" cy="238" r="5"/><circle cx="983" cy="238" r="5"/><circle cx="1008" cy="238" r="5"/><circle cx="1033" cy="238" r="5"/><circle cx="1058" cy="238" r="5"/><circle cx="1083" cy="238" r="5"/><circle cx="1108" cy="238" r="5"/>
      <circle cx="858" cy="252" r="5"/><circle cx="883" cy="252" r="5"/><circle cx="908" cy="252" r="5"/><circle cx="933" cy="252" r="5"/><circle cx="958" cy="252" r="5"/><circle cx="983" cy="252" r="5"/><circle cx="1008" cy="252" r="5"/><circle cx="1033" cy="252" r="5"/><circle cx="1058" cy="252" r="5"/><circle cx="1083" cy="252" r="5"/><circle cx="1108" cy="252" r="5"/>
    </g>
    <text x="836" y="310" font-size="15" fill="#17212b">60% remains (illustrative)</text>
    <text x="836" y="338" font-size="13" fill="#344454">Dots are not counted as time units.</text>
  </g>
  <text x="40" y="400" font-family="sans-serif" font-size="14" fill="#344454">Concepts are unselected proposals, not findings about user preference or accessibility.</text>
</svg>
